<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A design mockup with sample data: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/dashboard/assets/brand/pleasebookme-mark-small.svg" />
    <title>Widget đặt lịch | pleasebookme</title>
    <script>
      // Set the theme before the first paint: the saved choice, else dark.
      (function () {
        var saved;
        try {
          saved = localStorage.getItem("pbm-theme");
        } catch (e) {}
        if (saved !== "light" && saved !== "dark") {
          saved = "dark";
        }
        document.documentElement.dataset.theme = saved;
        // ?window=<widget id> is the widget alone, as it opens in a window of its own.
        if (/[?&]window=/.test(location.search)) document.documentElement.dataset.window = "";
        try {
          if (localStorage.getItem("pbm-sidebar") === "collapsed") {
            document.documentElement.dataset.sidebar = "collapsed";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/dashboard/assets/tokens.css?v=a28b2197" />
    <link rel="stylesheet" href="/dashboard/assets/shell.css?v=a48a6f5e" />
    <link rel="stylesheet" href="/dashboard/widgets/widgets.css?v=47a2fc5c" />
  </head>
  <body>
    <aside id="sidebar" class="chrome sidebar"></aside>
    <header id="topbar" class="chrome topbar"></header>

    <!-- The list of widgets, or that widget alone in a window of its own (the
         address ends in ?window=<widget id>; the sidebar and top bar are not
         drawn). -->
    <main class="page" id="view"></main>

    <!-- The stage (shell.css), always full screen here: the editor for one
         widget (#<widget id>) and, beside it, a new service or resource
         (#<widget id>/new-service, /new-resource). -->
    <div class="pane-stage" id="pane-stage" data-lock="full" hidden>
      <section class="pane wd-pane" id="wd" aria-label="Widget" hidden></section>
      <aside class="pane pane-side" id="wd-side" role="dialog" aria-labelledby="side-title" hidden></aside>
    </div>

    <script src="/dashboard/assets/shell.js?v=f3cda895"></script>
    <script src="/dashboard/assets/sample.js?v=f72a9c5e"></script>
    <script src="/dashboard/assets/store.js?v=c6cdc347"></script>
    <script src="/dashboard/widgets/widgets.js?v=70585b86"></script>
  </body>
</html>
