<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A design mockup with sample data: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/dashboard/assets/brand/pleasebookme-mark-small.svg" />
    <title>Lịch hẹn | pleasebookme</title>
    <script>
      // Set the theme before the first paint: the saved choice, else dark.
      (function () {
        var saved;
        try {
          saved = localStorage.getItem("pbm-theme");
        } catch (e) {}
        if (saved !== "light" && saved !== "dark") {
          saved = "dark";
        }
        document.documentElement.dataset.theme = saved;
        try {
          if (localStorage.getItem("pbm-sidebar") === "collapsed") {
            document.documentElement.dataset.sidebar = "collapsed";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/dashboard/assets/tokens.css?v=a28b2197" />
    <link rel="stylesheet" href="/dashboard/assets/shell.css?v=a48a6f5e" />
    <link rel="stylesheet" href="/dashboard/bookings/bookings.css?v=2644f845" />
  </head>
  <body>
    <aside id="sidebar" class="chrome sidebar"></aside>
    <header id="topbar" class="chrome topbar"></header>

    <main class="page page-fill">
      <header class="head">
        <h1 id="title"></h1>
        <div class="toolbar" id="toolbar"></div>
      </header>

      <div class="board" id="board">
        <section class="panel stage" id="stage"></section>
        <aside class="rail-wrap"><div class="rail" id="rail"></div></aside>
      </div>
    </main>

    <aside class="sheet panel" id="sheet" role="dialog" aria-labelledby="sheet-name" hidden></aside>

    <!-- The stage (shell.css): one pane for two jobs, adding or moving a
         booking and blocking time, and beside it a new service or staff
         member. -->
    <div class="pane-stage" id="pane-stage" hidden>
      <aside class="pane" id="dialog" role="dialog" aria-labelledby="dialog-title" hidden></aside>
      <aside class="pane pane-side" id="bk-side" role="dialog" aria-labelledby="bk-side-title" hidden></aside>
    </div>

    <script src="/dashboard/assets/shell.js?v=f3cda895"></script>
    <script src="/dashboard/assets/sample.js?v=f72a9c5e"></script>
    <script src="/dashboard/assets/store.js?v=c6cdc347"></script>
    <script src="/dashboard/bookings/bookings.js?v=1ddf2ea8"></script>
  </body>
</html>
