<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A design mockup with sample data: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/dashboard/assets/brand/pleasebookme-mark-small.svg" />
    <title>Tổng quan | pleasebookme</title>
    <script>
      // Set the theme before the first paint: the saved choice, else dark.
      (function () {
        var saved;
        try {
          saved = localStorage.getItem("pbm-theme");
        } catch (e) {}
        if (saved !== "light" && saved !== "dark") {
          saved = "dark";
        }
        document.documentElement.dataset.theme = saved;
        try {
          if (localStorage.getItem("pbm-sidebar") === "collapsed") {
            document.documentElement.dataset.sidebar = "collapsed";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/dashboard/assets/tokens.css" />
    <link rel="stylesheet" href="/dashboard/assets/shell.css" />
    <link rel="stylesheet" href="/dashboard/dashboard.css" />
  </head>
  <body>
    <aside id="sidebar" class="chrome sidebar"></aside>
    <header id="topbar" class="chrome topbar"></header>

    <main class="page">
      <header class="head">
        <h1 id="title"></h1>
        <!-- The date, and which branches the page counts (when the shop has more than one). -->
        <div class="head-tools">
          <p id="date"></p>
          <div id="scope"></div>
        </div>
      </header>

      <!-- Four counts. Each picks the list the table below shows. -->
      <section class="counts" id="counts" role="tablist" aria-label="Danh sách lịch hẹn"></section>

      <!-- The picked list. A row opens the booking in the side panel. -->
      <section class="panel list" id="list" role="tabpanel"></section>

      <p class="deeper-link" id="deeper"></p>
      <p class="note" id="note"></p>
    </main>

    <!-- One booking, beside the page, as in Notion's side peek. -->
    <aside class="sheet panel" id="sheet" role="dialog" aria-labelledby="sheet-name" hidden></aside>

    <script src="/dashboard/assets/shell.js"></script>
    <script src="/dashboard/assets/sample.js"></script>
    <script src="/dashboard/dashboard.js"></script>
  </body>
</html>
