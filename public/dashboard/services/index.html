<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A design mockup with sample data: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/dashboard/assets/brand/pleasebookme-mark-small.svg"
    />
    <title>Dịch vụ | pleasebookme</title>
    <script>
      // Set the theme before the first paint: the saved choice, else dark.
      (function () {
        var saved;
        try {
          saved = localStorage.getItem("pbm-theme");
        } catch (e) {}
        if (saved !== "light" && saved !== "dark") {
          saved = "dark";
        }
        document.documentElement.dataset.theme = saved;
        try {
          if (localStorage.getItem("pbm-sidebar") === "collapsed") {
            document.documentElement.dataset.sidebar = "collapsed";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/dashboard/assets/tokens.css?v=a28b2197" />
    <link rel="stylesheet" href="/dashboard/assets/shell.css?v=a48a6f5e" />
    <link rel="stylesheet" href="/dashboard/services/services.css?v=1c92259b" />
  </head>
  <body>
    <aside id="sidebar" class="chrome sidebar"></aside>
    <header id="topbar" class="chrome topbar"></header>

    <main class="page">
      <header class="head">
        <h1 id="title"></h1>
        <div class="toolbar" id="toolbar"></div>
        <p id="lede"></p>
      </header>

      <!-- How a booking with several services is staffed: the one shop-wide
           setting left here. Each service keeps its own rules (4 November). -->
      <section class="panel shop" id="shop" aria-labelledby="shop-title" hidden></section>

      <!-- The menu: one tile per service, in the owner's order. The first is wide. -->
      <div class="tiles" id="tiles"></div>

      <!-- The same menu as a table, for reading and changing many services at once. -->
      <section class="panel menu-table" id="table" hidden></section>

      <p class="note" id="note"></p>
    </main>

    <!-- The stage (shell.css): one service in five parts (#new, #s/<id>), and
         beside it the form for a new staff member (.../staff). In the app this
         is /dashboard/services/<id>?tabName=... -->
    <div class="pane-stage" id="pane-stage" hidden>
      <aside class="pane" id="svc" role="dialog" aria-labelledby="svc-title" hidden></aside>
      <aside class="pane pane-side" id="staff-new" role="dialog" aria-labelledby="staff-title" hidden></aside>
    </div>

    <script src="/dashboard/assets/shell.js?v=f3cda895"></script>
    <script src="/dashboard/assets/sample.js?v=f72a9c5e"></script>
    <script src="/dashboard/assets/store.js?v=c6cdc347"></script>
    <script src="/dashboard/services/services.js?v=0535abc0"></script>
  </body>
</html>
