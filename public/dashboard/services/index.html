<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A design mockup with sample data: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/dashboard/assets/brand/pleasebookme-mark-small.svg"
    />
    <title>Dịch vụ | pleasebookme</title>
    <script>
      // Set the theme before the first paint: the saved choice, else the device setting.
      (function () {
        var saved;
        try {
          saved = localStorage.getItem("pbm-theme");
        } catch (e) {}
        if (saved !== "light" && saved !== "dark") {
          saved = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = saved;
        try {
          if (localStorage.getItem("pbm-sidebar") === "collapsed") {
            document.documentElement.dataset.sidebar = "collapsed";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/dashboard/assets/tokens.css" />
    <link rel="stylesheet" href="/dashboard/assets/shell.css" />
    <link rel="stylesheet" href="/dashboard/services/services.css" />
  </head>
  <body>
    <aside id="sidebar" class="chrome sidebar"></aside>
    <header id="topbar" class="chrome topbar"></header>

    <main class="page">
      <header class="head">
        <h1 id="title"></h1>
        <div class="toolbar" id="toolbar"></div>
        <p id="lede"></p>
      </header>

      <!-- Set once for the shop; every service follows these unless it has its own rule. -->
      <section
        class="panel shop"
        id="shop"
        aria-labelledby="shop-title"
      ></section>

      <!-- The menu: one tile per service, in the owner's order. The first is wide. -->
      <div class="tiles" id="tiles"></div>

      <!-- The same menu as a table, for reading and changing many services at once. -->
      <section class="panel menu-table" id="table" hidden></section>

      <p class="note" id="note"></p>
    </main>

    <!-- The window that edits one service. -->
    <dialog class="window" id="window" aria-labelledby="window-title"></dialog>

    <script src="/dashboard/assets/shell.js"></script>
    <script src="/dashboard/assets/sample.js"></script>
    <script src="/dashboard/services/services.js"></script>
  </body>
</html>
