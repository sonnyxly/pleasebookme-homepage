<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A design mockup with sample data: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/dashboard/assets/brand/pleasebookme-mark-small.svg" />
    <title>Tài nguyên | pleasebookme</title>
    <script>
      // Set the theme before the first paint: the saved choice, else dark.
      (function () {
        var saved;
        try {
          saved = localStorage.getItem("pbm-theme");
        } catch (e) {}
        if (saved !== "light" && saved !== "dark") {
          saved = "dark";
        }
        document.documentElement.dataset.theme = saved;
        try {
          if (localStorage.getItem("pbm-sidebar") === "collapsed") {
            document.documentElement.dataset.sidebar = "collapsed";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/dashboard/assets/tokens.css?v=a28b2197" />
    <link rel="stylesheet" href="/dashboard/assets/shell.css?v=a48a6f5e" />
    <link rel="stylesheet" href="/dashboard/resources/resources.css?v=03ece5fa" />
  </head>
  <body>
    <aside id="sidebar" class="chrome sidebar"></aside>
    <header id="topbar" class="chrome topbar"></header>

    <!-- The list. Everything else opens over it, on the stage. -->
    <main class="page" id="view"></main>

    <!-- The stage (shell.css): full screen, or docked at the right. It holds
         one resource or one type that exists (#r/<id>, #t/<id>), the form for
         a new resource (#new), and the form for a new type, beside the new
         resource (#new/type) or on its own (#new-type). In the app these are
         /dashboard/resources/<id>, /new and /types/new. -->
    <div class="pane-stage" id="pane-stage" hidden>
      <aside class="pane peek" id="peek" role="dialog" aria-labelledby="peek-title" hidden></aside>
      <aside class="pane peek" id="add" role="dialog" aria-labelledby="add-title" hidden></aside>
      <aside class="pane pane-side peek" id="add-type" role="dialog" aria-labelledby="type-title" hidden></aside>
    </div>

    <script src="/dashboard/assets/shell.js?v=f3cda895"></script>
    <script src="/dashboard/assets/sample.js?v=f72a9c5e"></script>
    <script src="/dashboard/assets/store.js?v=c6cdc347"></script>
    <script src="/dashboard/resources/resources.js?v=a57f17ff"></script>
  </body>
</html>
