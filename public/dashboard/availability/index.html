<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A design mockup with sample data: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/dashboard/assets/brand/pleasebookme-mark-small.svg" />
    <title>Giờ làm việc | pleasebookme</title>
    <script>
      // Set the theme before the first paint: the saved choice, else dark.
      (function () {
        var saved;
        try {
          saved = localStorage.getItem("pbm-theme");
        } catch (e) {}
        if (saved !== "light" && saved !== "dark") {
          saved = "dark";
        }
        document.documentElement.dataset.theme = saved;
        try {
          if (localStorage.getItem("pbm-sidebar") === "collapsed") {
            document.documentElement.dataset.sidebar = "collapsed";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/dashboard/assets/tokens.css?v=a28b2197" />
    <link rel="stylesheet" href="/dashboard/assets/shell.css?v=89c17816" />
    <link rel="stylesheet" href="/dashboard/availability/availability.css?v=a4934179" />
  </head>
  <body>
    <aside id="sidebar" class="chrome sidebar"></aside>
    <header id="topbar" class="chrome topbar"></header>

    <!-- The list of schedules. -->
    <main class="page" id="view"></main>

    <!-- The stage (shell.css): one schedule (#new, #<schedule id>; in the app
         /dashboard/availability/new and /<id>) and, beside it, a date override
         (#<id>/override). -->
    <div class="pane-stage" id="pane-stage" hidden>
      <aside class="pane" id="av" role="dialog" aria-labelledby="av-title" hidden></aside>
      <aside class="pane pane-side" id="av-side" role="dialog" aria-labelledby="ov-title" hidden></aside>
    </div>

    <script src="/dashboard/assets/shell.js?v=07c7cfd9"></script>
    <script src="/dashboard/assets/sample.js?v=a2ab41de"></script>
    <script src="/dashboard/assets/store.js?v=942b2426"></script>
    <script src="/dashboard/availability/availability.js?v=3d871a5c"></script>
  </body>
</html>
